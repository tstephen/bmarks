[project]
name = "bmarks"
version = "0.1.0"
description = "Bookmark manipulator"
authors = [
    {name = "Tim Stephenson",email = "tim@knowprocess.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.11.5,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]
includes = [
    "templates/*.j2"
]

[project.scripts]
bmarks = "bmarks.main:main"

[tool.poetry]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
coverage = "^7.8.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
